<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>推し活 立替精算ツール｜MUZE TOOL BOX</title>
  <meta name="description" content="遠征のチケット代・ホテル代・グッズ代の立て替えを、誰が誰にいくら払えばいいか自動でまとめます。登録不要・データは端末の中だけ。" />
  <meta name="theme-color" content="#f1ebe1" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Klee+One:wght@600&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" />
  <link rel="stylesheet" href="style.css?v=20261008-v2" />
<script src="https://rikomuze.github.io/muze-tool-box/assets/app-back.js" defer></script>
</head>
<body>
  <nav class="tool-nav" aria-label="MUZE TOOL BOX">
    <a href="https://rikomuze.github.io/muze-tool-box/">← Muze Tool Box</a>
  </nav>

  <main class="app">
    <header class="hero">
      <h1>推し活 立替精算</h1>
      <p class="lead">チケット代やホテル代を立て替えたら、ここに書くだけ。誰が誰にいくら払えばいいか、送金回数が少なくなるようにまとめます。</p>
    </header>

    <!-- 1. メンバー -->
    <section class="sheet" id="membersSection" aria-labelledby="membersTitle">
      <h2 id="membersTitle"><span class="step">1</span>いっしょに精算する人</h2>
      <div class="member-chips" id="memberList" aria-live="polite"></div>
      <form class="member-add" id="memberForm" autocomplete="off">
        <label class="sr-only" for="memberName">名前</label>
        <input id="memberName" type="text" maxlength="12" enterkeyhint="done" placeholder="名前（例：わたし）" />
        <button type="submit" class="btn btn-ink">追加</button>
      </form>
      <p class="field-error" id="memberError" role="alert"></p>
    </section>

    <!-- 2. 支払い -->
    <section class="sheet" id="paymentsSection" aria-labelledby="paymentsTitle">
      <h2 id="paymentsTitle"><span class="step">2</span>立て替えた支払い</h2>

      <ul class="payment-list" id="paymentList"></ul>

      <p class="empty-hint" id="paymentsEmpty"></p>

      <form class="pay-form" id="payForm" autocomplete="off" novalidate>
        <p class="form-heading" id="formHeading">支払いを追加</p>

        <div class="field">
          <label for="itemName">なにの支払い？</label>
          <div class="chip-row" id="itemChips" role="group" aria-label="よく使う項目">
            <button type="button" class="chip" data-item="チケット代">チケット</button>
            <button type="button" class="chip" data-item="ホテル代">ホテル</button>
            <button type="button" class="chip" data-item="交通費">交通費</button>
            <button type="button" class="chip" data-item="グッズ代">グッズ</button>
            <button type="button" class="chip" data-item="カフェ・ごはん代">ごはん</button>
            <button type="button" class="chip" data-item="タクシー代">タクシー</button>
            <button type="button" class="chip" data-item="ロッカー代">ロッカー</button>
            <button type="button" class="chip" data-item="送料">送料</button>
          </div>
          <input id="itemName" type="text" maxlength="24" placeholder="上から選ぶか、自由に入力" />
        </div>

        <div class="field">
          <label for="itemAmount">金額</label>
          <div class="yen-input">
            <input id="itemAmount" type="text" inputmode="numeric" enterkeyhint="done" placeholder="48000" />
            <span aria-hidden="true">円</span>
          </div>
        </div>

        <fieldset class="field">
          <legend>立て替えた人</legend>
          <div class="chip-row" id="payerChips" role="radiogroup"></div>
        </fieldset>

        <fieldset class="field">
          <legend>割り方</legend>
          <div class="segmented" role="radiogroup">
            <label><input type="radio" name="splitMode" value="equal" checked /><span>みんなで均等に</span></label>
            <label><input type="radio" name="splitMode" value="individual" /><span>人ごとに金額</span></label>
          </div>
        </fieldset>

        <fieldset class="field" id="equalArea">
          <legend>割る人 <button type="button" class="link-btn" id="toggleAllBtn">全員</button></legend>
          <div class="chip-row" id="targetChips" role="group"></div>
          <p class="live-note" id="equalNote" aria-live="polite"></p>
        </fieldset>

        <fieldset class="field" id="individualArea" hidden>
          <legend>それぞれの金額</legend>
          <div class="individual-list" id="individualInputs"></div>
          <p class="live-note" id="individualNote" aria-live="polite"></p>
        </fieldset>

        <p class="field-error" id="formError" role="alert"></p>

        <div class="form-actions">
          <button type="submit" class="btn btn-ink btn-block" id="submitPaymentBtn">この支払いを追加</button>
          <div class="edit-actions" id="editActions" hidden>
            <button type="button" class="btn btn-ghost" id="cancelEditBtn">やめる</button>
            <button type="button" class="btn btn-danger" id="deletePaymentBtn">この支払いを削除</button>
          </div>
        </div>
      </form>
    </section>

    <!-- 3. 精算 -->
    <section class="result-wrap" id="resultSection" aria-labelledby="resultTitle">
      <h2 id="resultTitle" class="result-heading"><span class="step">3</span>精算</h2>
      <div class="slip" id="slip" aria-live="polite"></div>
      <div class="result-actions" id="resultActions" hidden>
        <button type="button" class="btn btn-ink" id="copyBtn">LINEなどに貼る文章をコピー</button>
        <button type="button" class="btn btn-ghost" id="imageBtn">画像で保存・シェア</button>
      </div>
      <button type="button" class="btn-text" id="resetBtn">ぜんぶ消して最初から</button>
    </section>

    <footer class="tool-footer">
      <p>入力した内容はこの端末のブラウザにだけ保存され、外部には送信されません。</p>
      <p>非公式のファンメイドツールです。<a href="https://rikomuze.github.io/muze-tool-box/">MUZE TOOL BOX のトップへ</a></p>
    </footer>
  </main>

  <!-- 下部の要約バー -->
  <div class="summary-bar" id="summaryBar" hidden>
    <p id="summaryText"></p>
    <a href="#resultSection" class="btn btn-ink btn-small">精算を見る</a>
  </div>

  <!-- トースト -->
  <div class="toast" id="toast" role="status" aria-live="polite" hidden>
    <span id="toastText"></span>
    <button type="button" id="toastUndo" hidden>元に戻す</button>
  </div>

  <!-- 長押し保存用 -->
  <div class="image-sheet" id="imageSheet" hidden role="dialog" aria-modal="true" aria-labelledby="imageSheetTitle">
    <div class="image-sheet-inner">
      <p id="imageSheetTitle" class="image-sheet-title">画像を長押しして保存してください</p>
      <img id="imageSheetImg" alt="精算結果の画像" />
      <button type="button" class="btn btn-ink btn-block" id="imageSheetClose">閉じる</button>
    </div>
  </div>

  <script src="script.js?v=20261008-v3"></script>
</body>
</html>
